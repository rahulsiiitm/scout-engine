name: scout-weekly

on:
  schedule:
    # Sunday 10:00 Asia/Kolkata = 04:30 UTC
    - cron: "30 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  funnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: scout-engine weekly
      - run: scout-engine stats
      - run: scout-engine learn
      - name: Commit weekly funnel
        run: |
          git config user.name "scout-engine[bot]"
          git config user.email "scout-engine[bot]@users.noreply.github.com"
          git add weekly/ data/
          if ! git diff --cached --quiet; then
            git commit -m "report: refresh weekly funnel"
            git push
          fi
