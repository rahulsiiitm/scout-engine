name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: scout-engine validate
      - name: Exercise daily state pipeline without GitHub writes
        run: |
          scout-engine reconcile
          scout-engine scan
          scout-engine stats
          scout-engine learn
          scout-engine validate
