name: scout-daily

on:
  schedule:
    # 07:37 Asia/Kolkata = 02:07 UTC.
    # Avoid the top-of-hour GitHub Actions congestion window.
    - cron: "7 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scout-daily
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[browser]"
      - name: Install Chromium fallback
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Sync label taxonomy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scout-engine labels
      - name: Reconcile, discover, scan, and refresh analytics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scout-engine daily
      - name: Commit deterministic state updates
        run: |
          git config user.name "scout-engine[bot]"
          git config user.email "scout-engine[bot]@users.noreply.github.com"
          git add data/ daily/ weekly/ run-log.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh scout state"
            git push
          fi
