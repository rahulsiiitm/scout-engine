name: scout-daily

on:
  schedule:
    # 07:30 Asia/Kolkata = 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scout-daily
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Sync label taxonomy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scout-engine labels
      - name: Reconcile, scan, and refresh analytics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scout-engine daily
      - name: Commit deterministic state updates
        run: |
          git config user.name "scout-engine[bot]"
          git config user.email "scout-engine[bot]@users.noreply.github.com"
          git add data/ weekly/ run-log.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh scout state"
            git push
          fi
