version: 1

# Employer-owned public career surfaces. `auto` means:
# official ATS fingerprint -> JobPosting JSON-LD -> static HTML -> browser fallback.
# The crawler obeys robots.txt and never authenticates, bypasses CAPTCHAs, or crawls private portals.
