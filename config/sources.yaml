version: 4

schedule:
  timezone: Asia/Kolkata
  time: "07:37"

discovery_targets:
  actionable_career_opportunities_per_day: 10
  quality_first: true
  competitions_do_not_count: true
  preferred_mix:
    new_grad_full_time: 5
    internship_with_ppo_or_conversion: 5
  flexible_mix: true
  if_target_not_met:
    expand_search_before_stopping: true
    do_not_lower_hard_gates: true
    report_shortfall: true

source_priority:
  - tier: 1
    name: structured_ats
    sources: [greenhouse, lever, ashby, workable, smartrecruiters]
  - tier: 2
    name: employer_owned_careers
    sources: [career_registry, jobposting_jsonld, sitemap, static_html, browser_fallback]
  - tier: 3
    name: company_and_startup_direct
    sources: [company_careers, yc_hiring, wellfound, amazon_jobs]
  - tier: 4
    name: aggregators
    sources: [linkedin_jobs, instahyre, cutshort]
  - tier: 5
    name: competitions
    sources: [devpost, mlh, unstop, hackerearth, kaggle]

crawl:
  enabled: true
  registry: config/companies.yaml
  user_agent: "ScoutEngineBot/1.0 (+https://github.com/rahulsiiitm/scout-engine)"
  request_timeout_seconds: 20
  max_redirects: 5
  max_pages_per_company: 12
  browser_fallback: true
  obey_robots: true
  stale_after_successful_misses: 2
  conditional_requests: true
  block_private_networks: true

search_lanes:
  - name: new_grad_full_time
    terms:
      - "software engineer new grad"
      - "machine learning engineer new grad"
      - "AI engineer new grad"
      - "backend engineer new grad"
      - "graduate software engineer"
      - "SDE 1"
      - "0-2 years software engineer"
  - name: internship_to_full_time
    terms:
      - "AI intern PPO"
      - "machine learning intern PPO"
      - "software engineer intern PPO"
      - "backend intern PPO"
      - "internship full-time conversion"
      - "6 month internship 2027"
      - "final year internship full-time"
  - name: adjacent_high_signal
    terms:
      - "forward deployed engineer intern"
      - "AI reliability intern"
      - "ML infrastructure intern"
      - "computer vision intern"
      - "perception engineer new grad"

limits:
  per_source_timeout_seconds: 30
  retry_failed_source: false
  partial_failure_alert_threshold: 0.50

matching:
  minimum_score: 6
  urgent_score_floor: 4
  urgent_deadline_days: 5
  high_fit_score: 8
  confidence_floor: 0.55
  full_time_compensation:
    currency: INR
    minimum_lpa_exclusive: 10
    require_verified_compensation: true
    require_range_minimum_above_threshold: true
    reject_if_missing_or_ambiguous: true
    convert_foreign_currency_via_ecb: true
    applies_to: full_time_only
  internship_conversion:
    prefer_explicit_ppo: true
    prefer_full_time_conversion: true
    prefer_final_year_eligible: true
    conversion_signal_bonus: true
  skip_mid_senior_unless:
    - "0-2 years"
    - "new grad welcome"

competition_filters:
  minimum_prize_usd: 1000
  deadline_within_days: 21
  recognizable_sponsor_always_surface: true

dedupe:
  state_file: data/opportunities.json
  key_preference: [source_id, canonical_url]
  fuzzy_company_title_threshold: 0.86

state:
  canonical_file: data/opportunities.json
  source_stats_file: data/source-stats.json
  preference_file: data/preferences.json
  suppressions_file: data/suppressions.jsonl
  crawl_cache_file: data/crawl-cache.json
  fx_file: data/fx-rates.json
  all_timestamps_utc: true
  display_timezone: Asia/Kolkata

output:
  repository: rahulsiiitm/scout-engine
  digest_issue_title: "📡 Digest — Daily Scout Summary"
  labels: [job, hackathon, urgent, high-fit]
  auto_apply: false
  auto_send_outreach: false
  close_issue_on_apply: false
  terminal_stages: [rejected, expired, withdrawn, offer_accepted, not_pursuing]
