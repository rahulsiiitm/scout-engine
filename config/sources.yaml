version: 2

schedule:
  timezone: Asia/Kolkata
  time: "07:30"

source_priority:
  - tier: 1
    name: structured_ats
    sources: [greenhouse, lever, ashby, workable]
  - tier: 2
    name: company_and_startup_direct
    sources: [company_careers, yc_hiring, wellfound]
  - tier: 3
    name: aggregators
    sources: [linkedin_jobs, instahyre, cutshort]
  - tier: 4
    name: competitions
    sources: [devpost, mlh, unstop, hackerearth, kaggle]

limits:
  per_source_timeout_seconds: 30
  retry_failed_source: false
  partial_failure_alert_threshold: 0.50

matching:
  minimum_score: 6
  urgent_score_floor: 4
  urgent_deadline_days: 5
  high_fit_score: 8
  confidence_floor: 0.55
  full_time_compensation:
    currency: INR
    minimum_lpa_exclusive: 10
    require_verified_compensation: true
    require_range_minimum_above_threshold: true
    reject_if_missing_or_ambiguous: true
    applies_to: full_time_only
  skip_mid_senior_unless:
    - "0-2 years"
    - "new grad welcome"

competition_filters:
  minimum_prize_usd: 1000
  deadline_within_days: 21
  recognizable_sponsor_always_surface: true

dedupe:
  state_file: data/opportunities.json
  key_preference: [source_id, canonical_url]
  fuzzy_company_title_threshold: 0.86

state:
  canonical_file: data/opportunities.json
  source_stats_file: data/source-stats.json
  preference_file: data/preferences.json
  suppressions_file: data/suppressions.jsonl
  all_timestamps_utc: true
  display_timezone: Asia/Kolkata

output:
  repository: rahulsiiitm/scout-engine
  digest_issue_title: "📡 Digest — Daily Scout Summary"
  labels: [job, hackathon, urgent, high-fit]
  auto_apply: false
  auto_send_outreach: false
  close_issue_on_apply: false
  terminal_stages: [rejected, expired, withdrawn, offer_accepted, not_pursuing]
